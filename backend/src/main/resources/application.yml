server:
  port: ${SERVER_PORT:8081}
  # Trust X-Forwarded-* from Caddy. The rate limiter depends on this: the API container
  # publishes no ports and is reachable only from Caddy, so the header can only have come
  # from Caddy. Without it Spring ignores the header and every request looks like it arrives
  # from the Docker network address, putting all clients in one bucket and throttling them
  # together - which presents as "the site is broken sometimes".
  forward-headers-strategy: framework

spring:
  application:
    name: realmaths-api
  datasource:
    # SQLite keeps the whole database in one file: no server, no container, nothing
    # to connect to. Note the two pragmas, both of which matter:
    #   foreign_keys=on  - SQLite ignores foreign key constraints unless asked,
    #                      which would silently drop our ON DELETE CASCADE behaviour
    #   journal_mode=WAL - lets readers work while the single writer is writing
    #   busy_timeout     - wait rather than immediately failing on a locked database
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./data/realmaths.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite serialises writes, so a large pool only creates lock contention.
      maximum-pool-size: 5
      pool-name: realmaths-pool
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # Flyway owns the schema. See SchemaMigrationTest for the guarantees that
      # Hibernate's community SQLite dialect cannot reliably validate for us.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

realmaths:
  jwt:
    # Dev default only. Override with REALMATHS_JWT_SECRET in every real environment.
    secret: ${REALMATHS_JWT_SECRET:dev-only-secret-change-me-0123456789abcdefghijklmnopqrstuvwxyz}
    issuer: realmaths
    ttl: PT12H
  cors:
    allowed-origins: ${REALMATHS_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5173}
  quiz:
    default-question-count: 5
    max-question-count: 20
    points-per-correct-answer: 10
  game:
    # The reward level is paid for with maths. Rates are deliberately generous: this is a
    # carrot, and a student who answers five questions right should get a decent turn.
    seconds-per-correct-answer: 20
    perfect-bonus-seconds: 60
    # Ceiling on what one heartbeat gap can cost, so abandoning the tab is not a wipe-out.
    # Must be at least the client's heartbeat interval (10s), or every beat would be clipped.
    max-heartbeat-gap-seconds: 30

  google:
    # Public identifier, not a secret: it ships in the browser bundle and is used to
    # check the ID token's aud claim, so it must match VITE_GOOGLE_CLIENT_ID. Blank
    # disables Google sign-in (the app still starts).
    client-id: ${REALMATHS_GOOGLE_CLIENT_ID:}
    # Comma-separated Google Workspace domains to restrict sign-in to, checked against
    # the hd claim. Empty means any Google account, which is what we want for now.
    allowed-domains: ${REALMATHS_GOOGLE_ALLOWED_DOMAINS:}

  rate-limit:
    enabled: true
    # Ceiling on distinct client keys held in memory. An attacker with a large address pool
    # would otherwise grow the limiter until the heap ran out, turning a rate limiter into a
    # denial of service. When the map is full a NEW key is refused rather than evicting the
    # oldest, because evicting would let an attacker reset their own exhausted bucket.
    max-keys: 10000
    idle-expiry: PT1H

    # First match wins, so specific rules must come before the fallback.
    rules:
      # Unauthenticated account creation: this endpoint needs no credentials of any kind, so
      # it is the one thing a script can point at to grow the database or harvest tokens.
      - name: guest
        path: /api/auth/guest
        method: POST
        requests: 30
        period: PT1H
      # Verifying a Google ID token costs a signature check per call.
      - name: google-signin
        path: /api/auth/google
        method: POST
        requests: 60
        period: PT15M

    # Deliberately generous. A school is one NAT address, so thirty students answering
    # questions arrive as a single client: at 600/min a full class would throttle itself,
    # and the failure would look like the app being broken rather than like a limit.
    fallback:
      name: default
      path: /api/**
      requests: 1200
      period: PT1M

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.flywaydb: info
