name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default permissions for every job. The infra job below overrides these, because
# assuming an AWS role over OIDC needs id-token: write.
permissions:
  contents: read
  packages: write

# Queue runs rather than letting two overlap and race for the same host or the same
# Terraform state. Terraform's own S3 lock is a second line of defence.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    # Reuses ci.yml verbatim, so a failing test blocks everything downstream.
    uses: ./.github/workflows/ci.yml

  infra:
    name: Terraform
    needs: test
    runs-on: ubuntu-latest
    # Same guard as the deploy job: until SITE_DOMAIN is configured in repository
    # variables, infrastructure is a clean skip rather than a failed build.
    if: vars.SITE_DOMAIN != ''
    # Overrides the workflow-level permissions. id-token is what lets this job
    # exchange a GitHub OIDC token for temporary AWS credentials, so no access key
    # exists anywhere.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    outputs:
      static_ip: ${{ steps.apply.outputs.static_ip }}
      instance_name: ${{ steps.apply.outputs.instance_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Assume the CI role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Named so CloudTrail shows which run made each API call.
          role-session-name: gha-terraform-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
          # The wrapper exists to capture stdout into step outputs, which we do not
          # use. Leaving it off avoids it interfering with `terraform output`.
          terraform_wrapper: false

      - name: Init
        # bucket and region come from here rather than versions.tf, because a
        # backend block cannot reference variables.
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

      - name: Apply
        id: apply
        # TF_VAR_* is Terraform's environment-variable convention, which keeps this
        # step free of a long list of -var flags.
        env:
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_availability_zone: ${{ vars.AWS_AVAILABILITY_ZONE }}
          TF_VAR_domain_name: ${{ vars.SITE_DOMAIN }}
          TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
          # Parsed as HCL, so the list brackets are part of the value.
          TF_VAR_ssh_cidr: '["${{ vars.SSH_CIDR }}"]'
        run: |
          terraform apply -auto-approve -input=false
          echo "static_ip=$(terraform output -raw static_ip)" >> "$GITHUB_OUTPUT"
          echo "instance_name=$(terraform output -raw instance_name)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Infrastructure"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Static IP | \`${{ steps.apply.outputs.static_ip }}\` |"
            echo "| Domain | \`${{ vars.SITE_DOMAIN }}\` |"
            echo "| Region | \`${{ vars.AWS_REGION }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build images
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_base: ${{ steps.vars.outputs.image_base }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image base
        id: vars
        # GHCR rejects uppercase paths and github.repository is "KateSant/real-maths",
        # so the owner must be lowercased or the push fails.
        run: |
          base="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_base=$base" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.vars.outputs.image_base }}/api:${{ github.sha }}
            ${{ steps.vars.outputs.image_base }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          # Repository root, because the image needs the top-level Caddyfile.
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_base }}/web:${{ github.sha }}
            ${{ steps.vars.outputs.image_base }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to Lightsail
    # Both are required: images to run and a host to run them on. The host address
    # comes from the Terraform job rather than a stored secret, so it cannot drift
    # from the infrastructure that actually exists.
    needs: [infra, build]
    runs-on: ubuntu-latest
    if: vars.SITE_DOMAIN != ''
    # An environment allows a required reviewer and scopes the deploy secrets.
    environment: production
    # The deploy needs AWS access, but only to open and close a single firewall rule
    # for this runner's address. The role grants Lightsail and nothing else.
    #
    # packages: read is not optional. Declaring permissions here REPLACES the
    # workflow-level block rather than merging with it, so adding id-token silently
    # dropped packages: write and the host could log in to GHCR but not pull the
    # private images ("error from registry: denied"). Read is enough to pull; the
    # build job is the one that needs write.
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Assume the CI role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Authorise this runner for SSH
        # Port 22 is closed to the world and open only to the developer's address, so
        # a runner cannot reach it: GitHub's egress addresses are unpredictable, which
        # is exactly why a static allow-list is not an option. Instead the runner adds
        # its own address for the duration of the deploy and removes it again below.
        # The rule is a single /32 for one address.
        env:
          INSTANCE: ${{ needs.infra.outputs.instance_name }}
        run: |
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          echo "runner egress address: $RUNNER_IP"
          echo "RUNNER_CIDR=$RUNNER_IP/32" >> "$GITHUB_ENV"
          aws lightsail open-instance-public-ports \
            --instance-name "$INSTANCE" \
            --port-info "fromPort=22,toPort=22,protocol=TCP,cidrs=$RUNNER_IP/32"
          echo "opened for $RUNNER_IP/32"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          # Named deploy_key rather than id_ed25519: ssh reads the key type from the
          # file contents, so a Lightsail-generated RSA key works here too, and the
          # name should not imply ed25519. Every call below passes -i explicitly.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is pinned from a secret rather than fetched with
          # ssh-keyscan, so a man in the middle cannot substitute the deploy target.
          printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload compose file and edge config
        env:
          DEPLOY_HOST: ${{ needs.infra.outputs.static_ip }}
        run: |
          HOST="${{ secrets.DEPLOY_USER }}@$DEPLOY_HOST"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$HOST" 'mkdir -p /srv/realmaths'
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            docker-compose.prod.yml Caddyfile "$HOST:/srv/realmaths/"

      - name: Pull images and restart
        env:
          DEPLOY_HOST: ${{ needs.infra.outputs.static_ip }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_BASE: ${{ needs.build.outputs.image_base }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN is scoped to this run and expires with it, so the host is
          # never left holding a long-lived registry credential: it logs in, pulls,
          # and logs out again. The token is briefly visible in the remote process
          # list, which is an accepted tradeoff for not storing a PAT on the box.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$GHCR_TOKEN" "$IMAGE_TAG" "$IMAGE_BASE" "$GHCR_USER" <<'REMOTE'
          set -euo pipefail
          TOKEN="$1"; TAG="$2"; BASE="$3"; USERNAME="$4"
          cd /srv/realmaths

          echo "$TOKEN" | docker login ghcr.io -u "$USERNAME" --password-stdin

          # Exported so they override the values in the host's .env file. Compose
          # gives shell environment precedence over .env.
          export IMAGE_API="$BASE/api:$TAG"
          export IMAGE_WEB="$BASE/web:$TAG"

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          # Record the tags just deployed. The host deliberately holds no registry
          # credential, so a later manual `docker compose up` has to reference images
          # already on disk. Without this, .env drifts to :latest, which the host
          # cannot authenticate to pull.
          sed -i "s|^IMAGE_API=.*|IMAGE_API=$IMAGE_API|; s|^IMAGE_WEB=.*|IMAGE_WEB=$IMAGE_WEB|" .env

          docker logout ghcr.io
          # Reclaim space from superseded images on a small disk.
          docker image prune -f
          REMOTE

      - name: Smoke test
        env:
          # The full site address INCLUDING scheme. Caddy uses the scheme to decide
          # whether to request a certificate, so it is configuration rather than
          # something to assume: 'http://16.60.38.27' serves plain HTTP, while a bare
          # hostname triggers automatic HTTPS.
          SITE: ${{ vars.SITE_DOMAIN }}
        run: |
          echo "Checking $SITE"

          # Caddy requests its certificate on first start, which takes a few seconds.
          # Retrying beats a fixed sleep: a slow ACME round trip is not reported as a
          # failed deploy, and a fast one costs nothing. Without this, the very first
          # deploy fails with a TLS alert for a site that is seconds from healthy.
          wait_for() {
            local url="$1" want="$2" label="$3" attempts="${4:-40}"
            local code="000"
            for attempt in $(seq 1 "$attempts"); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" 2>/dev/null || echo 000)
              if [ "$code" = "$want" ]; then
                echo "  $label -> $code (attempt $attempt)"
                return 0
              fi
              sleep 5
            done
            echo "  $label -> expected $want but kept seeing $code"
            return 1
          }

          # /api is proxied through to the API, which must refuse an anonymous
          # request with 401. A 200 (stale SPA served) or 502 (API unreachable) both
          # fail here, so this catches a broken deploy rather than a broken container.
          wait_for "$SITE/" 200 "GET /"
          wait_for "$SITE/api/topics" 401 "GET /api/topics"
          echo "Deploy verified."

      - name: Revoke this runner's SSH access
        # Always runs, including after a failure above, so the temporary rule cannot
        # linger. If the job is killed outright the rule survives until the next
        # deploy opens and closes its own, which is a single address either way.
        if: always()
        env:
          INSTANCE: ${{ needs.infra.outputs.instance_name }}
        run: |
          if [ -z "${RUNNER_CIDR:-}" ]; then
            echo "no rule was opened, nothing to revoke"
            exit 0
          fi
          aws lightsail close-instance-public-ports \
            --instance-name "$INSTANCE" \
            --port-info "fromPort=22,toPort=22,protocol=TCP,cidrs=$RUNNER_CIDR"
          echo "closed for $RUNNER_CIDR"
