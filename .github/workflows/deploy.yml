name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repository and write container packages. Note there are
# no AWS permissions here, because deploying is an SSH plus docker compose operation
# rather than an AWS API call. If CI ever needs to run Terraform or touch Route 53,
# that is when to add GitHub OIDC and an IAM role here.
permissions:
  contents: read
  packages: write

# Queue deploys rather than letting two overlap and race for the same host.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    # Reuses ci.yml verbatim, so a failing test blocks the deploy.
    uses: ./.github/workflows/ci.yml

  build:
    name: Build images
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_base: ${{ steps.vars.outputs.image_base }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image base
        id: vars
        # GHCR rejects uppercase paths and github.repository is "KateSant/real-maths",
        # so the owner must be lowercased or the push fails.
        run: |
          base="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_base=$base" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.vars.outputs.image_base }}/api:${{ github.sha }}
            ${{ steps.vars.outputs.image_base }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          # Repository root, because the image needs the top-level Caddyfile.
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_base }}/web:${{ github.sha }}
            ${{ steps.vars.outputs.image_base }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to Lightsail
    needs: build
    runs-on: ubuntu-latest
    # Guard so that pushing the pipeline before the host exists is a clean skip
    # rather than a red build. Set the SITE_ADDRESS repository variable (and the
    # deploy secrets below) once the instance is up, and this job starts running.
    if: vars.SITE_ADDRESS != ''
    # An environment allows a required reviewer and scopes the deploy secrets.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          # Named deploy_key rather than id_ed25519: ssh reads the key type from the
          # file contents, so a Lightsail-generated RSA key works here too, and the
          # name should not imply ed25519. Every call below passes -i explicitly.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is pinned from a secret rather than fetched with
          # ssh-keyscan, so a man in the middle cannot substitute the deploy target.
          printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload compose file and edge config
        run: |
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$HOST" 'mkdir -p /srv/realmaths'
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            docker-compose.prod.yml Caddyfile "$HOST:/srv/realmaths/"

      - name: Pull images and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_BASE: ${{ needs.build.outputs.image_base }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN is scoped to this run and expires with it, so the host is
          # never left holding a long-lived registry credential: it logs in, pulls,
          # and logs out again. The token is briefly visible in the remote process
          # list, which is an accepted tradeoff for not storing a PAT on the box.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$GHCR_TOKEN" "$IMAGE_TAG" "$IMAGE_BASE" "$GHCR_USER" <<'REMOTE'
          set -euo pipefail
          TOKEN="$1"; TAG="$2"; BASE="$3"; USERNAME="$4"
          cd /srv/realmaths

          echo "$TOKEN" | docker login ghcr.io -u "$USERNAME" --password-stdin

          # Exported so they override the values in the host's .env file. Compose
          # gives shell environment precedence over .env.
          export IMAGE_API="$BASE/api:$TAG"
          export IMAGE_WEB="$BASE/web:$TAG"

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          docker logout ghcr.io
          # Reclaim space from superseded images on a small disk.
          docker image prune -f
          REMOTE

      - name: Smoke test
        env:
          SITE: ${{ vars.SITE_ADDRESS }}
        run: |
          echo "Checking $SITE"
          curl -fsS -o /dev/null "$SITE/"

          # /api is proxied through to the API, which must refuse an anonymous
          # request with 401. A 200 (stale SPA served) or 502 (API unreachable)
          # both fail here, so this catches a broken deploy rather than just a
          # broken container.
          status=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/api/topics")
          echo "  $SITE/api/topics -> $status"
          test "$status" = "401"
          echo "Deploy verified."
