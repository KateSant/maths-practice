# Local development and self-hosted deployment stack.
#
# There is no longer a database container: SQLite lives in a file inside the API
# container (or on your laptop), so this is a single-service stack.
#
#   ./mvnw spring-boot:run          # local dev, no Docker needed at all
#   docker compose up --build       # containerised, data in the realmaths-data volume
services:
  api:
    build: ./backend
    container_name: realmaths-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/realmaths.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
      REALMATHS_JWT_SECRET: ${REALMATHS_JWT_SECRET:-dev-only-secret-change-me-0123456789abcdefghijklmnopqrstuvwxyz}
      REALMATHS_CORS_ALLOWED_ORIGINS: http://localhost:5174,http://localhost:5173
    volumes:
      # The SQLite file must outlive the container. Backing it up is `cp`.
      - realmaths-data:/data
    ports:
      - "8081:8081"

volumes:
  realmaths-data:
